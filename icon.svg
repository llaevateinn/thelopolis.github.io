<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 鎏金外框 -->
  <rect x="1" y="1" width="62" height="62" rx="9" fill="#a8842a"/>
  <rect x="3" y="3" width="58" height="58" rx="7" fill="#efd98a"/>
  <!-- 墨蓝石碑 -->
  <rect x="6" y="6" width="52" height="52" rx="5" fill="#15264e"/>
  <rect x="6" y="6" width="52" height="52" rx="5" fill="none" stroke="#0b1330" stroke-width="1.5"/>
